<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470"
     font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
     role="img" aria-label="The kubastion console: a terminal you drive yourself, a live pod grid underneath.">
  <title>kubastion</title>

  <rect x="6" y="6" width="708" height="458" rx="10" fill="#eef1f5" stroke="#d6dde6" stroke-width="1.5"/>

  <!-- ── app bar ────────────────────────────────────────────────────────── -->
  <path d="M6 16a10 10 0 0 1 10-10h688a10 10 0 0 1 10 10v26H6z" fill="#ffffff"/>
  <line x1="6" y1="42" x2="714" y2="42" stroke="#d6dde6" stroke-width="1.5"/>

  <g transform="translate(18 13) scale(0.3)">
    <g fill="none" stroke="#7fb0f5" stroke-width="3.4" stroke-linecap="round" opacity=".55">
      <circle cx="32" cy="32" r="19.5"/>
      <path d="M32 12.5V5.5M32 51.5v7M12.5 32H5.5M51.5 32h7"/>
      <path d="M18.2 18.2 13.2 13.2M45.8 45.8l5 5M45.8 18.2l5-5M18.2 45.8l-5 5"/>
    </g>
    <g fill="#c9d2dc" stroke="#1e3a6b" stroke-width="2.6" stroke-linejoin="round">
      <path d="M20.5 22.5v-6.8h5.6v3.4h3.1v-3.4h5.6v3.4h3.1v-3.4h5.6v6.8z"/>
      <rect x="23.2" y="22.5" width="17.6" height="21.3" rx="1.4"/>
      <rect x="19.8" y="43.8" width="24.4" height="7.2" rx="1.8"/>
    </g>
    <path d="M32 15.7V4.4" fill="none" stroke="#1e3a6b" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M33.4 4.6c3.4-1.8 5.8 1.8 8.6.2v6.4c-2.8 1.6-5.2-2-8.6-.2z" fill="#4c9aff" stroke="#1e3a6b" stroke-width="2.2"/>
  </g>

  <text x="40" y="29" fill="#16202b" font-size="13" font-weight="700">kubastion</text>
  <rect x="106" y="15" width="106" height="18" rx="5" fill="#f5f7fa" stroke="#d6dde6"/>
  <text x="113" y="28" fill="#8493a6" font-size="8.5" letter-spacing=".5">NAMESPACE</text>
  <text x="172" y="28" fill="#16202b" font-size="11" font-family="ui-monospace, monospace">demo</text>

  <circle cx="558" cy="24" r="4" fill="#11724a"/>
  <text x="568" y="28" fill="#11724a" font-size="11.5" font-weight="500">Monitoring</text>
  <rect x="634" y="14" width="66" height="20" rx="5" fill="#ffffff" stroke="#bcc7d4"/>
  <text x="643" y="28" fill="#16202b" font-size="10.5">Stop monitoring</text>

  <!-- ── stat strip ─────────────────────────────────────────────────────── -->
  <rect x="6" y="42" width="708" height="42" fill="#ffffff"/>
  <line x1="6" y1="84" x2="714" y2="84" stroke="#d6dde6" stroke-width="1.5"/>
  <g stroke="#d6dde6"><path d="M147 42v42M288 42v42M429 42v42M570 42v42"/></g>

  <g font-size="8.5" fill="#8493a6" letter-spacing=".6">
    <text x="18" y="58">PODS</text>
    <text x="159" y="58">HEALTHY</text>
    <text x="300" y="58">NEEDS ATTENTION</text>
    <text x="441" y="58">RESTARTS</text>
    <text x="582" y="58">LAST UPDATE</text>
  </g>
  <g font-size="15" font-weight="600">
    <text x="18" y="76" fill="#16202b">8</text>
    <text x="159" y="76" fill="#11724a">4</text>
    <text x="300" y="76" fill="#ad2a22">4</text>
    <text x="441" y="76" fill="#8a5a06">10</text>
    <text x="582" y="75" fill="#16202b" font-size="12">just now</text>
  </g>

  <!-- ── terminal panel: the part you drive yourself ─────────────────────── -->
  <rect x="16" y="94" width="688" height="146" rx="6" fill="#ffffff" stroke="#d6dde6"/>
  <path d="M16 100a6 6 0 0 1 6-6h676a6 6 0 0 1 6 6v16H16z" fill="#f5f7fa"/>
  <line x1="16" y1="116" x2="704" y2="116" stroke="#d6dde6"/>
  <text x="27" y="110" fill="#16202b" font-size="9" font-weight="700" letter-spacing=".6">TERMINAL</text>
  <text x="86" y="110" fill="#8493a6" font-size="10.5">your session — nothing is typed here while you are using it</text>

  <path d="M16 116h688v118a6 6 0 0 1-6 6H22a6 6 0 0 1-6-6z" fill="#0f1419"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">
    <text x="28" y="134" fill="#d5dde6"><tspan fill="#3ec18c">$</tspan> ssh jump-host</text>
    <text x="28" y="151" fill="#7c8b9c">  1) cluster-a      2) cluster-b</text>
    <text x="28" y="168" fill="#d5dde6">select destination: <tspan fill="#e8b04b">1</tspan></text>
    <text x="28" y="190" fill="#3ec18c">you@jump-host<tspan fill="#7c8b9c">:</tspan><tspan fill="#4c9aff">~</tspan><tspan fill="#d5dde6">$ kubectl get pods</tspan></text>
    <text x="28" y="207" fill="#7c8b9c">NAME                          READY   STATUS</text>
    <text x="28" y="224" fill="#7c8b9c">api-gateway-7d9f8b6c4-2xk9p   1/1     Running</text>
  </g>

  <!-- ── pods panel ─────────────────────────────────────────────────────── -->
  <rect x="16" y="250" width="688" height="182" rx="6" fill="#ffffff" stroke="#d6dde6"/>
  <path d="M16 256a6 6 0 0 1 6-6h676a6 6 0 0 1 6 6v16H16z" fill="#f5f7fa"/>
  <line x1="16" y1="272" x2="704" y2="272" stroke="#d6dde6"/>
  <text x="27" y="266" fill="#16202b" font-size="9" font-weight="700" letter-spacing=".6">PODS</text>
  <text x="62" y="266" fill="#8493a6" font-size="10.5">polled in the session above, and paused while you use it</text>

  <!-- toolbar -->
  <rect x="17" y="272" width="686" height="30" fill="#f5f7fa"/>
  <line x1="16" y1="302" x2="704" y2="302" stroke="#d6dde6"/>
  <rect x="27" y="279" width="150" height="18" rx="5" fill="#ffffff" stroke="#bcc7d4"/>
  <g transform="translate(34 284)" stroke="#8493a6" fill="none" stroke-width="1.3">
    <circle cx="4" cy="4" r="3.2"/><path d="M6.4 6.4 9 9" stroke-linecap="round"/>
  </g>
  <text x="49" y="292" fill="#8493a6" font-size="10">Filter by name or status</text>

  <rect x="185" y="279" width="86" height="18" rx="5" fill="#ffffff" stroke="#bcc7d4"/>
  <rect x="191" y="284" width="8" height="8" rx="2" fill="#ffffff" stroke="#8493a6"/>
  <text x="204" y="292" fill="#5c6b80" font-size="10">Only issues</text>

  <rect x="279" y="279" width="108" height="18" rx="5" fill="#ffffff" stroke="#bcc7d4"/>
  <text x="286" y="292" fill="#16202b" font-size="10">Run a command…</text>
  <path d="M374 286l4 4 4-4" fill="none" stroke="#5c6b80" stroke-width="1.3" stroke-linecap="round"/>

  <text x="694" y="292" fill="#8493a6" font-size="10" text-anchor="end">8 of 8</text>

  <!-- grid header -->
  <rect x="17" y="302" width="686" height="20" fill="#eaeef3"/>
  <line x1="16" y1="322" x2="704" y2="322" stroke="#bcc7d4"/>
  <g fill="#5c6b80" font-size="8.5" font-weight="600" letter-spacing=".7">
    <text x="27" y="316">POD ↑</text>
    <text x="412" y="316">STATUS</text>
    <text x="566" y="316" text-anchor="end">READY</text>
    <text x="632" y="316" text-anchor="end">RESTARTS</text>
    <text x="694" y="316" text-anchor="end">NODE</text>
  </g>

  <!-- rows -->
  <g font-size="10.5">
    <rect x="17" y="322" width="686" height="22" fill="#ffffff"/>
    <rect x="27" y="328" width="3" height="11" rx="1.5" fill="#11724a"/>
    <text x="38" y="337" fill="#16202b" font-family="ui-monospace, monospace">api-gateway-7d9f8b6c4-2xk9p</text>
    <rect x="412" y="326" width="54" height="14" rx="7" fill="#e0f3e9"/>
    <circle cx="421" cy="333" r="2.6" fill="#11724a"/>
    <text x="428" y="337" fill="#11724a">Running</text>
    <text x="566" y="337" fill="#16202b" text-anchor="end" font-family="ui-monospace, monospace">1/1</text>
    <text x="632" y="337" fill="#16202b" text-anchor="end" font-family="ui-monospace, monospace">0</text>
    <text x="694" y="337" fill="#8493a6" text-anchor="end">node-01</text>
    <line x1="17" y1="344" x2="703" y2="344" stroke="#d6dde6"/>

    <rect x="17" y="344" width="686" height="22" fill="#f5f7fa"/>
    <rect x="27" y="350" width="3" height="11" rx="1.5" fill="#11724a"/>
    <text x="38" y="359" fill="#16202b" font-family="ui-monospace, monospace">auth-service-849c6f7d5-lm4qv</text>
    <rect x="412" y="348" width="54" height="14" rx="7" fill="#e0f3e9"/>
    <circle cx="421" cy="355" r="2.6" fill="#11724a"/>
    <text x="428" y="359" fill="#11724a">Running</text>
    <text x="566" y="359" fill="#16202b" text-anchor="end" font-family="ui-monospace, monospace">2/2</text>
    <text x="632" y="359" fill="#8a5a06" text-anchor="end" font-weight="600" font-family="ui-monospace, monospace">1</text>
    <text x="694" y="359" fill="#8493a6" text-anchor="end">node-03</text>
    <line x1="17" y1="366" x2="703" y2="366" stroke="#d6dde6"/>

    <!-- the row you opened the tab for -->
    <rect x="17" y="366" width="686" height="22" fill="#fcebe9"/>
    <rect x="27" y="372" width="3" height="11" rx="1.5" fill="#ad2a22"/>
    <text x="38" y="381" fill="#16202b" font-family="ui-monospace, monospace">billing-service-5c7d4f8b9-hq2mn</text>
    <rect x="412" y="370" width="108" height="14" rx="7" fill="#ffffff"/>
    <circle cx="421" cy="377" r="2.6" fill="#ad2a22"/>
    <text x="428" y="381" fill="#ad2a22">CrashLoopBackOff</text>
    <text x="566" y="381" fill="#8a5a06" text-anchor="end" font-weight="600" font-family="ui-monospace, monospace">1/2</text>
    <text x="632" y="381" fill="#8a5a06" text-anchor="end" font-weight="600" font-family="ui-monospace, monospace">9</text>
    <text x="694" y="381" fill="#8493a6" text-anchor="end">node-02</text>
    <line x1="17" y1="388" x2="703" y2="388" stroke="#d6dde6"/>

    <rect x="17" y="388" width="686" height="22" fill="#f5f7fa"/>
    <rect x="27" y="394" width="3" height="11" rx="1.5" fill="#ad2a22"/>
    <text x="38" y="403" fill="#16202b" font-family="ui-monospace, monospace">notification-worker-6b8c9d5e7-p4tzw</text>
    <rect x="412" y="392" width="104" height="14" rx="7" fill="#fcebe9"/>
    <circle cx="421" cy="399" r="2.6" fill="#ad2a22"/>
    <text x="428" y="403" fill="#ad2a22">ImagePullBackOff</text>
    <text x="566" y="403" fill="#8a5a06" text-anchor="end" font-weight="600" font-family="ui-monospace, monospace">0/1</text>
    <text x="632" y="403" fill="#16202b" text-anchor="end" font-family="ui-monospace, monospace">0</text>
    <text x="694" y="403" fill="#8493a6" text-anchor="end">node-01</text>
    <line x1="17" y1="410" x2="703" y2="410" stroke="#d6dde6"/>

    <rect x="17" y="410" width="686" height="21" fill="#ffffff"/>
    <rect x="27" y="415" width="3" height="11" rx="1.5" fill="#11724a"/>
    <text x="38" y="424" fill="#16202b" font-family="ui-monospace, monospace">redis-cache-0</text>
    <rect x="412" y="413" width="54" height="14" rx="7" fill="#e0f3e9"/>
    <circle cx="421" cy="420" r="2.6" fill="#11724a"/>
    <text x="428" y="424" fill="#11724a">Running</text>
    <text x="566" y="424" fill="#16202b" text-anchor="end" font-family="ui-monospace, monospace">1/1</text>
    <text x="632" y="424" fill="#16202b" text-anchor="end" font-family="ui-monospace, monospace">0</text>
    <text x="694" y="424" fill="#8493a6" text-anchor="end">node-02</text>
  </g>

  <!-- ── status bar ─────────────────────────────────────────────────────── -->
  <path d="M6 438h708v16a10 10 0 0 1-10 10H16a10 10 0 0 1-10-10z" fill="#ffffff"/>
  <line x1="6" y1="438" x2="714" y2="438" stroke="#d6dde6" stroke-width="1.5"/>
  <circle cx="20" cy="452" r="3.5" fill="#11724a"/>
  <text x="29" y="456" fill="#11724a" font-size="10">Monitoring</text>
  <text x="82" y="456" fill="#8493a6" font-size="10">Polling pods in the session you opened</text>
  <text x="700" y="456" fill="#8493a6" font-size="10" text-anchor="end">127.0.0.1 only · no telemetry</text>
</svg>
