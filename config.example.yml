# Copy this file to config.yml and fill it in. config.yml is git-ignored.
#
# IMPORTANT: never put real hostnames, namespaces or internal URLs in this
# example file — it is the one that gets committed.

kubastion:
  terminal:
    # Local shell opened in the browser terminal. Leave EMPTY to get your OS
    # default (PowerShell on Windows, $SHELL elsewhere) — that is almost always
    # what you want, because you then run ssh from it yourself.
    command: ""
    args: []

  kubectl:
    # Path to kubectl ON THE REMOTE MACHINE, the one you reach through the
    # terminal. Usually just "kubectl".
    binary: kubectl
    # Namespace to watch.
    namespace: my-namespace
    # Optional: passed as --context. Leave empty to use the remote default.
    context: ""

  monitor:
    # How often `kubectl get pods` runs once monitoring is on.
    interval-seconds: 3
    # Past this, the command is considered lost and the terminal is handed
    # back to you rather than staying hidden.
    timeout-seconds: 15
    # How long the terminal must be quiet before a command may be injected.
    # The session is yours first: a half-typed line pauses polling no matter
    # what this says, and 0 only turns off the timer, never that rule.
    quiet-seconds: 2
