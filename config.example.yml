# Copy this file to config.yml and fill it in. config.yml is git-ignored.
#
# IMPORTANT: never put real hostnames, namespaces or internal URLs in this
# example file — it is the one that gets committed.

kubastion:
  ssh:
    # The SSH destination exactly as you would type it after `ssh`.
    # Using an alias defined in your ~/.ssh/config is the cleanest option,
    # because then kubastion inherits your jump-host and key configuration.
    #   Host jump
    #     HostName <bastion>
    #     User <user>
    #     ControlMaster auto          # Linux/macOS only: makes log fetches instant
    #     ControlPath ~/.ssh/cm-%r@%h:%p
    #     ControlPersist 2h
    destination: jump

    # Extra arguments passed to the ssh binary. Keep BatchMode so kubastion
    # never blocks waiting for an interactive password prompt.
    options:
      - -o
      - BatchMode=yes
      - -o
      - ServerAliveInterval=30

  kubectl:
    # Path to kubectl ON THE REMOTE HOST. Usually just "kubectl".
    binary: kubectl
    # Namespace to watch.
    namespace: my-namespace
    # Optional: context to pass with --context. Leave empty to use the default.
    context: ""

  logs:
    # Lines fetched when you click the log button.
    tailLines: 300

  watch:
    # Seconds to wait before restarting the watch stream after it dies,
    # e.g. when your short-lived credential expires.
    retryDelaySeconds: 5
