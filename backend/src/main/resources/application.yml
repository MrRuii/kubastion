spring:
  application:
    name: kubastion
  # Real configuration lives in config.yml at the project root and is
  # git-ignored: that is where your namespace and context go.
  config:
    import:
      - optional:file:../config.yml
      - optional:file:./config.yml

server:
  port: 8080
  # No external binding: kubastion only talks to your machine.
  address: 127.0.0.1

kubastion:
  terminal:
    # Local shell opened in the browser terminal. Empty = OS default
    # (PowerShell on Windows, $SHELL elsewhere). From here you run ssh.
    command: ""
    args: []
  kubectl:
    binary: kubectl
    # Empty = the default namespace of your logged-in session (what you get by
    # typing `kubectl get pods` yourself). Set a name only to watch another one.
    namespace: ""
    context: ""
  monitor:
    interval-seconds: 3
    timeout-seconds: 15
    # The terminal must be quiet this long before a command is injected.
    quiet-seconds: 2

logging:
  level:
    io.kubastion: DEBUG
