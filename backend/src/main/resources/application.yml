spring:
  application:
    name: kubastion
  # Real configuration lives in config.yml at the project root and is
  # git-ignored: that is where your namespace and context go.
  config:
    import:
      - optional:file:../config.yml
      - optional:file:./config.yml

server:
  port: 8080
  # No external binding: kubastion only talks to your machine.
  address: 127.0.0.1

kubastion:
  terminal:
    # Local shell opened in the browser terminal. Empty = OS default
    # (PowerShell on Windows, $SHELL elsewhere). From here you run ssh.
    command: ""
    args: []
  kubectl:
    binary: kubectl
    namespace: default
    context: ""
  monitor:
    interval-seconds: 3
    timeout-seconds: 15

logging:
  level:
    io.kubastion: DEBUG
