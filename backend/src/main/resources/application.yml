spring:
  application:
    name: kubastion
  # La configurazione reale sta in config.yml nella root del progetto ed e'
  # git-ignorata: e' li' che finiscono namespace e contesto veri.
  config:
    import:
      - optional:file:../config.yml
      - optional:file:./config.yml

server:
  port: 8080
  # Nessun bind esterno: kubastion parla solo con la tua macchina.
  address: 127.0.0.1

kubastion:
  terminal:
    # Shell locale aperta nel terminale del browser. Vuoto = automatica
    # (powershell su Windows, $SHELL altrove). Da qui fai ssh-add, ssh, menu.
    command: ""
    args: []
  kubectl:
    binary: kubectl
    namespace: default
    context: ""
  monitor:
    interval-seconds: 3
    timeout-seconds: 15

logging:
  level:
    io.kubastion: DEBUG
